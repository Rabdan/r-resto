services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
      network: host
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
      - ./data:/data
    environment:
      DATABASE_PATH: /data/sqlite/pos.db
      UPLOADS_PATH: /data/uploads
    working_dir: /app

volumes:
  app_node_modules:
